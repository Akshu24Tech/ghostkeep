[project]
name = "ghostkeep"
version = "0.2.0"
description = "Provenance-aware shared memory store and System 1 micro-decision sieve for AI agents."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Akshu24Tech"}
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
typesafe = [
    "typesafe-sdk>=0.1.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ghostkeep = "ghostkeep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghostkeep"]
