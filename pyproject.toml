[project]
name = "ghostkeep"
version = "0.2.0"
description = "Verified handoffs between free AI coding tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ghostkeep = "ghostkeep.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostkeep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
