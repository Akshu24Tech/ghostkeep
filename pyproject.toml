[project]
name = "ghostkeep"
version = "0.7.0"
description = "Verified handoffs between free AI coding tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Akshu Grewal" }]
keywords = ["ai", "coding-agents", "handoff", "git", "claude-code", "codex", "antigravity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
codex = ["zstandard>=0.22"]   # read Codex's older compressed (.zst) session logs

[project.urls]
Homepage = "https://github.com/Akshu24Tech/ghostkeep"
Repository = "https://github.com/Akshu24Tech/ghostkeep"
Issues = "https://github.com/Akshu24Tech/ghostkeep/issues"
Changelog = "https://github.com/Akshu24Tech/ghostkeep/commits/main"

[project.scripts]
ghostkeep = "ghostkeep.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["docs/demo.gif", "uv.lock", ".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/ghostkeep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
