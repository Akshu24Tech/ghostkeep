[project]
name = "ghostkeep"
version = "0.1.0"
description = "Provenance-aware shared memory store and MCP server for AI agents across Claude Desktop, Cursor, Gemini CLI, and Windsurf."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Akshu24Tech"}
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
