<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#080c14"/>
    </radialGradient>
    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101726" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b101b" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Accent Line -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="900" fill="#080c14"/>
  <rect x="50" y="50" width="1100" height="800" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1"/>
  <rect x="250" y="50" width="700" height="1" fill="url(#lineGrad)"/>

  <!-- Top Tag -->
  <rect x="100" y="105" width="200" height="28" rx="14" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
  <text x="200" y="124" class="font-sans" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5" text-anchor="middle">SHARED AGENT MEMORY</text>

  <!-- Title & Subtitle -->
  <text x="100" y="185" class="font-sans" font-size="38" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">From Chat Logs to Verifiable Claims</text>
  <text x="100" y="222" class="font-sans" font-size="18" font-weight="400" fill="#94a3b8">Replacing noisy conversational memory with deterministic truth.</text>

  <rect x="910" y="110" width="190" height="36" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="1005" y="133" class="font-mono" font-size="13" fill="#64748b" text-anchor="middle">ledger: claims.jsonl</text>

  <!-- Main Card Container -->
  <rect x="100" y="260" width="1000" height="450" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>

  <!-- Card Header -->
  <path d="M 100 260 L 1100 260 L 1100 315 L 100 315 Z" fill="#182235" fill-opacity="0.5"/>
  <line x1="100" y1="315" x2="1100" y2="315" stroke="#1e293b" stroke-width="1"/>
  
  <text x="135" y="294" class="font-sans" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">ID</text>
  <text x="240" y="294" class="font-sans" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">CLAIM / FACT</text>
  <text x="750" y="294" class="font-sans" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">GROUNDING EVIDENCE</text>
  <text x="965" y="294" class="font-sans" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">STATUS</text>

  <!-- Row 1: C-001 -->
  <line x1="100" y1="400" x2="1100" y2="400" stroke="#172234" stroke-width="1"/>
  <text x="135" y="365" class="font-mono" font-size="15" font-weight="600" fill="#94a3b8">C-001</text>
  <text x="240" y="365" class="font-sans" font-size="17" font-weight="500" fill="#f1f5f9">server.py is configured for port 8765</text>
  <text x="750" y="365" class="font-mono" font-size="14" fill="#64748b">SHA: 8d8d36d2</text>
  <!-- Badge Checked -->
  <rect x="945" y="342" width="115" height="32" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="1002" y="363" class="font-mono" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.5">CHECKED</text>

  <!-- Row 2: C-002 -->
  <line x1="100" y1="490" x2="1100" y2="490" stroke="#172234" stroke-width="1"/>
  <text x="135" y="452" class="font-mono" font-size="15" font-weight="600" fill="#94a3b8">C-002</text>
  <text x="240" y="452" class="font-sans" font-size="17" font-weight="500" fill="#f1f5f9">server is listening on 8765</text>
  <text x="750" y="452" class="font-mono" font-size="14" fill="#64748b">10m runtime window</text>
  <!-- Badge Stale -->
  <rect x="945" y="430" width="115" height="32" rx="6" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
  <text x="1002" y="451" class="font-mono" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="0.5">STALE</text>

  <!-- Row 3: C-004 -->
  <line x1="100" y1="580" x2="1100" y2="580" stroke="#172234" stroke-width="1"/>
  <text x="135" y="542" class="font-mono" font-size="15" font-weight="600" fill="#94a3b8">C-004</text>
  <text x="240" y="542" class="font-sans" font-size="17" font-weight="500" fill="#f1f5f9">Do not invent a config format.</text>
  <text x="750" y="542" class="font-mono" font-size="14" fill="#64748b">User constraint</text>
  <!-- Badge Declared -->
  <rect x="945" y="520" width="115" height="32" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="1002" y="541" class="font-mono" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="0.5">DECLARED</text>

  <!-- Row 4: C-009 -->
  <text x="135" y="642" class="font-mono" font-size="15" font-weight="600" fill="#94a3b8">C-009</text>
  <text x="240" y="642" class="font-sans" font-size="17" font-weight="500" fill="#f1f5f9">commit 35d3235 exists on origin/main</text>
  <text x="750" y="642" class="font-mono" font-size="14" fill="#64748b">Git SHA check</text>
  <!-- Badge Checked -->
  <rect x="945" y="620" width="115" height="32" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="1002" y="641" class="font-mono" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.5">CHECKED</text>

  <!-- Footer Line -->
  <line x1="100" y1="755" x2="1100" y2="755" stroke="#1e293b" stroke-width="1"/>

  <!-- Footer Principles -->
  <circle cx="110" cy="790" r="3.5" fill="#38bdf8"/>
  <text x="125" y="794" class="font-sans" font-size="14" font-weight="500" fill="#94a3b8">Deterministic hash verification</text>

  <circle cx="430" cy="790" r="3.5" fill="#38bdf8"/>
  <text x="445" y="794" class="font-sans" font-size="14" font-weight="500" fill="#94a3b8">Runtime state decays over time</text>

  <circle cx="750" cy="790" r="3.5" fill="#38bdf8"/>
  <text x="765" y="794" class="font-sans" font-size="14" font-weight="500" fill="#94a3b8">Epistemic debt over silent deletion</text>

  <text x="1100" y="794" class="font-mono" font-size="13" fill="#475569" text-anchor="end">Phase 0 Spike</text>
</svg>
