name: Ghostkeep Memory Audit & CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    name: Deterministic Memory Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for commit verification checks

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Ghostkeep Memory Status
        run: |
          python ghostkeep.py status

      - name: Run Deterministic Memory Auditor
        run: |
          python ghostkeep.py audit

      - name: Verify MCP Server Compilation
        run: |
          python -c "import mcp_server; print('[OK] FastMCP Server import and tool schemas verified')"

      - name: Verify Memory Drift
        run: |
          git status --short
